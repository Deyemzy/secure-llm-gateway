name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: "8.30.0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history: secrets in old commits count too
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar -xzf "$tarball" gitleaks && sudo mv gitleaks /usr/local/bin/
      - name: Scan full git history
        run: gitleaks git --log-opts="--all" --redact --no-banner -v .
      - name: Commit messages are one line
        run: |
          # 7c5a3e0: GitHub's two-line merge commit for PR #2, made before the repo switched to
          # squash-only merges (PR title, blank body). The only exception; every other commit must be one line.
          allow="7c5a3e05bf6ac9110f6b87fa7688c38b6bc7766e"
          bad=0
          for c in $(git rev-list --all); do
            case " $allow " in *" $c "*) continue ;; esac
            n=$(git log -1 --format=%B "$c" | sed '/^[[:space:]]*$/d' | wc -l)
            if [ "$n" -ne 1 ]; then echo "::error::$c has a $n-line message"; bad=1; fi
          done
          exit $bad
      - name: No AI attribution in any commit message
        run: |
          if git log --all --format='%H%n%B' | grep -iE 'co-authored-by:.*(claude|anthropic)|generated with .*claude|noreply@anthropic\.com'; then
            echo "::error::AI attribution found in commit history"; exit 1
          fi

  test:
    needs: secrets
    runs-on: ubuntu-24.04
    env:
      # Admin connection for fixtures; the budget code itself connects as the least-privilege
      # slg-gateway user, so the production ACL is exercised against a real Valkey.
      REDIS_TEST_URL: redis://slg-test:test-only@127.0.0.1:6379/0
      REDIS_TEST_APP_URL: redis://slg-gateway:local-dev-only@127.0.0.1:6379/0
      REDIS_TEST_REPLICA_URL: redis://slg-test:test-only@127.0.0.1:6380/0
      REDIS_TEST_DRILL_URL: redis://slg-drill:drill-local-only@127.0.0.1:6379/0
      REQUIRE_REDIS: "1"   # ledger, concurrency, replica-ack and failover tests must run, not skip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: pip install -r gateway/requirements.txt pytest httpx openai
      - name: Start Valkey primary + replica
        run: docker compose up -d --wait
      - name: Tests + evidence report
        run: python scripts/evidence.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence
          path: docs/evidence/test-evidence.md
      - name: Stop Valkey
        if: always()
        run: docker compose down

  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.12.2
      - run: terraform fmt -recursive -check terraform
      - run: terraform -chdir=terraform/envs/dev init -backend=false -input=false
      - run: terraform -chdir=terraform/envs/dev validate
